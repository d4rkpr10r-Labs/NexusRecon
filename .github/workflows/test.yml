name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CrewAI does not yet support 3.14, see Prerequisites in MANUAL.md.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit + integration + smoke tests
        # tests/live/ is excluded by default (it hits real APIs and
        # needs secrets the public CI can't provide).
        run: pytest tests/unit tests/integration tests/smoke -q --tb=short

  # Lint runs once on the latest supported Python, same code under
  # every interpreter so no benefit from the full matrix.
  ruff:
    name: ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check nexusrecon tests

  # NEX-18 / P3.13: fresh-VM style install from a built wheel (PyPI-like),
  # not editable checkout. Confirms console scripts + verify_install.sh
  # on a clean venv for every supported Python on Linux x86_64.
  fresh-install:
    name: fresh wheel install (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel -o /tmp/nr-dist
          ls -la /tmp/nr-dist
          python -m zipfile -l /tmp/nr-dist/nexusrecon-*.whl > /tmp/nr-wheel-listing.txt
          grep -F 'nexusrecon/assets/nexusrecon-verify.py' /tmp/nr-wheel-listing.txt
          if grep -E 'packs/burp|packs\\.burp' /tmp/nr-wheel-listing.txt; then
            echo "packs/burp must not ship in the wheel (NEX-17)" >&2
            exit 1
          fi

      - name: Fresh venv install from wheel
        run: |
          python -m venv /tmp/nr-fresh
          /tmp/nr-fresh/bin/python -m pip install --upgrade pip
          /tmp/nr-fresh/bin/python -m pip install /tmp/nr-dist/nexusrecon-*.whl

      - name: Console scripts on PATH
        run: |
          export PATH="/tmp/nr-fresh/bin:$PATH"
          command -v nexusrecon
          command -v nexusrecon-verify
          nexusrecon --help >/dev/null
          nexusrecon-verify --help >/dev/null

      - name: Run verify_install.sh
        run: |
          export PATH="/tmp/nr-fresh/bin:$PATH"
          export PYTHON=/tmp/nr-fresh/bin/python
          ./scripts/verify_install.sh
